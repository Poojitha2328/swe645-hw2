<svg viewBox="0 0 520 420" xmlns="http://www.w3.org/2000/svg" class="art" role="img" aria-labelledby="heroTitle">
  <title id="heroTitle">Illustration of a laptop, a graph, and a network of connected nodes representing AI/ML engineering work</title>
  <rect x="0" y="0" width="520" height="420" fill="#f7f5f0"/>
  <circle cx="420" cy="70" r="110" fill="#eee7d3"/>

  <!-- network nodes -->
  <g stroke="#c9a227" stroke-width="2" fill="none" opacity="0.9">
    <line x1="70" y1="70" x2="150" y2="40"/>
    <line x1="150" y1="40" x2="230" y2="80"/>
    <line x1="70" y1="70" x2="230" y2="80"/>
    <line x1="230" y1="80" x2="300" y2="30"/>
  </g>
  <circle cx="70" cy="70" r="7" fill="#16213e"/>
  <circle cx="150" cy="40" r="7" fill="#c9a227"/>
  <circle cx="230" cy="80" r="7" fill="#16213e"/>
  <circle cx="300" cy="30" r="7" fill="#c9a227"/>

  <!-- laptop -->
  <g>
    <rect x="120" y="190" width="260" height="160" rx="6" fill="#16213e"/>
    <rect x="134" y="202" width="232" height="130" rx="2" fill="#f7f5f0"/>
    <rect x="90" y="350" width="330" height="16" rx="4" fill="#101830"/>
    <!-- bar chart on screen -->
    <rect x="156" y="270" width="18" height="48" fill="#c9a227"/>
    <rect x="184" y="250" width="18" height="68" fill="#16213e"/>
    <rect x="212" y="290" width="18" height="28" fill="#c9a227"/>
    <rect x="240" y="230" width="18" height="88" fill="#16213e"/>
    <rect x="268" y="260" width="18" height="58" fill="#c9a227"/>
    <path d="M156 260 L184 240 L212 275 L240 220 L268 250" stroke="#a3811c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- floating dots -->
  <circle cx="60" cy="300" r="5" fill="#c9a227"/>
  <circle cx="40" cy="260" r="4" fill="#16213e"/>
  <circle cx="470" cy="260" r="6" fill="#16213e"/>
  <circle cx="450" cy="310" r="4" fill="#c9a227"/>
</svg>
